name: Windows Cloud RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      # 1. Enable Remote Desktop
      - name: 1. Enable Remote Desktop & Firewall
        run: |
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" `
            -Value 0

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop"


      # 2. Create RDP account
      - name: 2. Create Admin Account
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |

          $SecurePassword = ConvertTo-SecureString `
            $env:RDP_PASSWORD `
            -AsPlainText `
            -Force

          New-LocalUser `
            -Name "CynetAdmin" `
            -Password $SecurePassword `
            -PasswordNeverExpires `
            -AccountNeverExpires `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member "CynetAdmin" `
            -ErrorAction SilentlyContinue


      # 3. Install & connect Tailscale
      - name: 3. Install & Connect Tailscale
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |

          Invoke-WebRequest `
            "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
            -OutFile "C:\tailscale.msi"

          Start-Process `
            msiexec.exe `
            -ArgumentList "/i C:\tailscale.msi /quiet /norestart" `
            -Wait

          Start-Sleep -Seconds 5

          & "C:\Program Files\Tailscale\tailscale.exe" up `
           --authkey="$Env:TAILSCALE_AUTHKEY" `
           --hostname="github-rdp-server" `
           --advertise-tags=tag:github-rdp

          Start-Sleep -Seconds 8


      # 4. Get Tailscale IP
      - name: 4. Get Tailscale IP
        shell: powershell
        run: |

          $ts_ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4

          Write-Host "=========================================="
          Write-Host "       RDP SERVER IS READY"
          Write-Host "=========================================="
          Write-Host "Tailscale IP: $ts_ip"
          Write-Host "Username: CynetAdmin"
          Write-Host "=========================================="


      # 5. Keep the server alive
      - name: 5. Keep Server Alive
        run: |

          for ($i = 1; $i -le 360; $i++) {
            Start-Sleep -Seconds 60
            Write-Host "[$i/360] Server running..."
          }
