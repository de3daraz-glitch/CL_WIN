name: Linux Tailscale Exit Node Test

on:
  workflow_dispatch:

jobs:
  exit-node:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:

      # 1. Enable IP forwarding
      - name: 1. Enable IP Forwarding
        run: |
          echo 'net.ipv4.ip_forward = 1' | sudo tee /etc/sysctl.d/99-tailscale.conf
          echo 'net.ipv6.conf.all.forwarding = 1' | sudo tee -a /etc/sysctl.d/99-tailscale.conf

          sudo sysctl -p /etc/sysctl.d/99-tailscale.conf

          echo "IPv4 forwarding:"
          sysctl net.ipv4.ip_forward

          echo "IPv6 forwarding:"
          sysctl net.ipv6.conf.all.forwarding


      # 2. Install and connect Tailscale
      - name: 2. Install & Connect Tailscale
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |

          curl -fsSL https://tailscale.com/install.sh | sh

          sudo tailscale up \
            --authkey="$TAILSCALE_AUTHKEY" \
            --hostname="github-linux-exit-node"


      # 3. Advertise as exit node
      - name: 3. Advertise Exit Node
        run: |

          sudo tailscale set --advertise-exit-node

          echo "=========================================="
          echo "       EXIT NODE ADVERTISED"
          echo "=========================================="

          sudo tailscale status

          echo ""
          echo "Tailscale IP:"
          sudo tailscale ip -4


      # 4. Keep server alive
      - name: 4. Keep Server Alive
        run: |

          for i in $(seq 1 360); do
            sleep 60
            echo "[$i/360] Exit node running..."
          done
